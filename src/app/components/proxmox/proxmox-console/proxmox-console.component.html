@if ({ value: consoleState$ | async }; as consoleState) {
  @if (consoleState.value?.showError) {
    <mat-icon
      class="center"
      svgIcon="ic_error_outline_black_48px"
      alt="Error"
    ></mat-icon>
  } @else if (consoleState.value?.showPower) {
    <mat-icon
      class="center"
      svgIcon="ic_power_settings_new_black_48px"
      alt="Off"
    ></mat-icon>
  } @else {
    <app-novnc
      [url]="consoleState.value?.url"
      [ticket]="consoleState.value?.ticket"
      [readOnly]="readOnly"
      (reconnect)="getConsole($event)"
    ></app-novnc>
  }
}
