@if ({ value: isConnected$ | async }; as isConnected) {
  <div class="screen-container" [hidden]="!isConnected.value === true">
    <div #screen id="screen" class="background screen">
      <!-- This is where the remote screen will appear -->
    </div>
  </div>
  @if (isConnected.value === false) {
    <div class="center" style="width: 70%">
      <h1>Connecting...</h1>
    </div>
  }
}
