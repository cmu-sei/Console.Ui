<div>
  <div>
    <div class="d-flex align-items-center">
      <button class="z-3" mat-icon-button [matMenuTriggerFor]="mainMenu">
        <mat-icon svgIcon="gear" alt="Gear"></mat-icon>
      </button>
      <span class="ms-1">{{ vm?.name }}</span>
      <mat-menu #mainMenu="matMenu">
        @if (!readOnly) {
          <button mat-menu-item [matMenuTriggerFor]="keyboardMenu">
            Keyboard
          </button>
          <mat-menu #keyboardMenu="matMenu">
            <button mat-menu-item (click)="ctrlAltDel()">
              Send Ctrl-Alt-Del
            </button>
            <button mat-menu-item (click)="sendClipboardText()">
              Paste to Clipboard
            </button>
          </mat-menu>

          <!-- Power -->
          <button mat-menu-item [matMenuTriggerFor]="powerMenu">Power</button>
          <mat-menu #powerMenu="matMenu">
            <button mat-menu-item (click)="powerOn()">Power On</button>
            <button mat-menu-item (click)="powerOff()">Power Off</button>
            <button mat-menu-item (click)="reboot()">Reboot</button>
            <button mat-menu-item (click)="shutdown()">Shutdown</button>
          </mat-menu>

          @if (canAccessNicConfiguration && networkMenuItems().length > 0) {
            <button mat-menu-item [matMenuTriggerFor]="networkMenu">
              Network Cards
            </button>
          }
          <mat-menu #networkMenu="matMenu">
            @for (adapter of networkMenuItems(); track adapter.key) {
              <button mat-menu-item [matMenuTriggerFor]="adapterMenu">
                {{ adapter.key }}
              </button>
              <mat-menu #adapterMenu="matMenu">
                @for (network of adapter.networks; track network.ref) {
                  <button
                    mat-menu-item
                    [disabled]="network.readOnly || network.ref === adapter.currentRef"
                    [matTooltip]="network.readOnly ? 'Current network — not in your allowed list' : ''"
                    (click)="changeNic(adapter.key, network.ref)"
                  >
                    @if (network.ref === adapter.currentRef) {
                      <span>&#10004;</span>
                    }
                    {{ network.name }}
                  </button>
                }
              </mat-menu>
            }
          </mat-menu>
        }

        <button mat-menu-item (click)="$event.stopPropagation()">
          <mat-slide-toggle
            labelPosition="before"
            color="primary"
            [checked]="(theme$ | async) === 'dark-theme'"
            (click)="$event.stopPropagation()"
            (change)="toggleTheme($event)"
          >
            <mat-label class="mat-mdc-menu-item-text me-2"
              >Dark Theme</mat-label
            >
          </mat-slide-toggle>
        </button>
      </mat-menu>
    </div>
  </div>
</div>
