name: Header_Check

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  headers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: cmu-sei/Crucible-Github-Actions/actions/header@header-v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
