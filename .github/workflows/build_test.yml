name: Build Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  build-test:
    uses: cmu-sei/Crucible-Github-Actions/.github/workflows/npm-test.yaml@npm-test-v1
    permissions:
      contents: read
    with:
      # Match the major version of the node image in this repo's Dockerfile.
      node-version: "24"
      # The Dockerfile's build, so a pull request catches a broken production build.
      build-command: npx ng build
